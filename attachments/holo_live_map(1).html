<!doctype html>
<html><head><meta charset="utf-8"><title>Möbii³us HOLO Live Map</title>
<style>body{font-family:system-ui,Arial;margin:16px} .grid{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.cell{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #999}
.legend{margin:8px 0} .ok{border-color:#2e7d32} .ask{border-color:#f9a825} .block{border-color:#c62828}</style>
</head><body>
<h2>HOLO Live Map (offline)</h2>
<div class="legend">Dream 1–64 • Field 65–128 • Street 129–192 • Ethics border: <span class="ok">allow</span> <span class="ask">ask</span> <span class="block">block</span></div>
<div id="grid" class="grid"></div>
<script>
async function loadJSON(path, fallback){ try{ const r=await fetch(path); if(!r.ok) throw new Error(); return await r.json(); }catch(e){ return fallback; } }
function streamFor(face){ if(face<=64) return 'dream'; if(face<=128) return 'field'; return 'street'; }
function ethicsClass(q){ if(q>=0.85) return 'ok'; if(q>=0.74) return 'ask'; return 'block'; }
async function render(){
  const summary = await loadJSON('memory_summary.json', {});
  const verdicts = await loadJSON('guardian_verdicts.json', {});
  const grid = document.getElementById('grid'); grid.innerHTML='';
  for(let face=1; face<=192; face++){
    const q = (verdicts[face]?.quantized_score) ?? 0.74;
    const div = document.createElement('div'); div.className='cell '+ethicsClass(q); div.title = 'Face '+face+' • '+streamFor(face);
    div.textContent = face; grid.appendChild(div);
  }
}
render();
</script></body></html>
