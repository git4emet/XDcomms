name: Provider contract
on:
  push:
    paths: ['services/providers/**', 'shared-contract.lock.json', 'scripts/check-shared-contract.mjs', '.github/workflows/provider-contract.yml']
  pull_request:
    paths: ['services/providers/**', 'shared-contract.lock.json', 'scripts/check-shared-contract.mjs', '.github/workflows/provider-contract.yml']
jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:contracts
      - run: npm run test:providers
